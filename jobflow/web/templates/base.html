<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JobFlow{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icon.svg') }}">
    <script>
    (function(){
        var t = localStorage.getItem('jf-theme') ||
                (matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', t);
    })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Hanken+Grotesk:wght@400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Toast container -->
    <div id="toast-container" aria-live="polite"></div>

    <nav class="topbar">
        <a class="brand" href="/linkedin">JobFlow<span class="brand-dot">.</span></a>
        <div class="topbar-side">
            <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle dark/light theme">
                <span class="theme-icon">&#9790;</span>
            </button>
            {% if auth_enabled and current_user and current_user.id %}
            <a class="btn btn-ghost" href="/settings" title="Your profile &amp; settings">Settings</a>
            <span class="user-chip" title="{{ current_user.email }}">
                {% if current_user.picture %}<img src="{{ current_user.picture }}" alt="" class="user-avatar">{% endif %}
                <span class="user-name">{{ current_user.name or current_user.email }}</span>
            </span>
            <a class="btn btn-ghost" href="/auth/logout">Sign out</a>
            {% endif %}
        </div>
    </nav>

    <main class="shell">
        {% block content %}{% endblock %}
    </main>

    <footer class="shell">
        <div class="foot">JobFlow · local job intelligence</div>
    </footer>

    <script>
    // ── Toast system ──────────────────────
    function showToast(message, type) {
        type = type || 'success';
        var container = document.getElementById('toast-container');
        var toast = document.createElement('div');
        toast.className = 'toast toast-' + type;
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(function() {
            toast.classList.add('toast-out');
            setTimeout(function() { toast.remove(); }, 260);
        }, 2600);
    }

    // ── Theme toggle ──────────────────────
    function syncThemeIcon() {
        var t = document.documentElement.getAttribute('data-theme');
        var icon = document.querySelector('.theme-icon');
        if (icon) icon.innerHTML = t === 'dark' ? '&#9788;' : '&#9790;';
    }
    function toggleTheme() {
        var html = document.documentElement;
        var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('jf-theme', next);
        syncThemeIcon();
    }
    syncThemeIcon();
    </script>
</body>
</html>
